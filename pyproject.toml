[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calcutils_cyuzuzo"
version = "0.1.0"
description = "A simple student tutorial math utility package"
readme = "README.md"
authors = [
    { name = "Cyuzuzo", email = "sandracyuzuzo14@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/CYUZUZO010/calcutils"